# The exact versions of the training-only Python packages, as installed and proven on the development machine
# (2026-10-13, Python 3.12, Windows). trainer/setup.sh installs from this file; trainer/requirements.txt holds the
# ranges it was resolved from and is only used when this file is missing.
#
# What is in it: every package trainer/requirements.txt asks for and everything those need, taken from
# `uv pip freeze --python trainer/.venv`. What is not: AMD's wheels (torch, torchaudio, torchvision, rocm and the
# rocm-sdk packages), which setup.sh installs by URL and SHA-256, and the packages only torch itself needs
# (jinja2, mpmath, sympy).
#
# To renew it after changing requirements.txt: install into trainer/.venv, run the real training tests, then
# rewrite this list from `uv pip freeze --python trainer/.venv`, leaving the packages named above out.
