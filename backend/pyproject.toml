[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aivoice"
version = "0.1.2"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy",
  "onnxruntime-directml",
  "sounddevice>=0.4.6",
  "soxr",
  "pyworld-prebuilt",
  "faiss-cpu",
  "psutil",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# faster-whisper itself is installed separately with --no-deps: it depends on the plain
# onnxruntime package, which would overwrite onnxruntime-directml and disable GPU live mode.
transcribe = ["ctranslate2>=4.0,<5", "huggingface-hub>=0.21", "tokenizers>=0.13,<1", "av>=11", "tqdm"]

[tool.setuptools.packages.find]
include = ["aivoice*"]

[tool.setuptools.package-data]
aivoice = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette recommends migrating the test client to httpx2; deferred pending the owner's approval of a new dependency.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning"]
