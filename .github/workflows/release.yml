name: Release

# A pushed tag v<version> builds the Windows installer and publishes it as a GitHub Release.
#
# To release: node scripts/version.mjs set 1.2.3, commit, git tag v1.2.3, git push --follow-tags.
# The tag must match the version in app/package.json or the build stops before it starts.
#
# The installer is built from a clean state: no Rust or npm cache is restored. The build job can only read
# the repository; only the publish job, which runs no code from the repository, may write (create the release).
# Every action is pinned to a full commit SHA; .github/dependabot.yml proposes updates.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Rust (stable, already on the runner through rustup)
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: The tag matches the version
        shell: pwsh
        run: node scripts/version.mjs check --tag "$env:TAG"

      - name: Fetch the pinned uv (fails unless its SHA-256 is the committed one)
        shell: pwsh
        run: ./scripts/fetch-uv.ps1

      - name: Install the app's packages
        working-directory: app
        run: npm ci

      - name: Frontend tests
        working-directory: app
        run: npx vitest run

      - name: Type check
        working-directory: app
        run: npx tsc --noEmit

      - name: Build the frontend (the Rust tests embed it)
        working-directory: app
        run: npm run build

      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test

      - name: First-run setup tests
        run: python -m unittest discover -s installer/tests -v

      - name: Build the installer (NSIS, per-user, x64)
        working-directory: app
        run: npm run installer

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: app/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write # to create the release; this job runs nothing from the repository
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: installer

      - name: Publish the release
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer -Filter "*-setup.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "No installer was built" }
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = @(
            "## Install",
            "",
            "Download **$($installer.Name)** below and run it. Windows 10 or 11 (64-bit) with a DirectX 12 GPU.",
            "",
            "The installer is not signed, so Windows SmartScreen may show ""Windows protected your PC"": choose **More info**, then **Run anyway**. The first start downloads about 525 MB once and needs an internet connection. See the Install section of the README for details, including what the installed app cannot do yet.",
            "",
            "SHA-256 of the installer: ``$hash``",
            ""
          ) -join "`n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release create "$env:TAG" "$($installer.FullName)" --verify-tag --title "Voxweave $env:TAG" --notes-file release-notes.md --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
