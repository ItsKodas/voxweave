name: CI

# Frontend tests and type check, the Rust shell's tests, and the tests of the first-run setup.
#
# The Python suite of the voice engine (backend/tests) is not run here: it needs the engine's environment
# (onnxruntime-directml, PortAudio through sounddevice, faiss, the speech packages) and it has only ever been run
# on the development PC. Whether it passes on a hosted runner without a GPU or audio device is unknown, so it is
# left out rather than added untested. Run it locally (README, Tests).

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Rust (stable, already on the runner through rustup)
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The version is the same everywhere
        run: node scripts/version.mjs check

      - name: Install the app's packages
        working-directory: app
        run: npm ci

      - name: Frontend tests
        working-directory: app
        run: npx vitest run

      - name: Type check
        working-directory: app
        run: npx tsc --noEmit

      - name: Build the frontend (the Rust tests embed it)
        working-directory: app
        run: npm run build

      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test

      - name: First-run setup tests (standard library only)
        run: python -m unittest discover -s installer/tests -v
